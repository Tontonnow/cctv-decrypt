name: Build and Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag used for release creation (e.g. v1.0.0)"
        required: true
        type: string
      nm3u8dl_tag:
        description: "N_m3u8DL-RE release tag"
        required: false
        default: "latest"
        type: string

permissions:
  contents: write

env:
  N_M3U8DL_RE_REPO: nilaoda/N_m3u8DL-RE
  N_M3U8DL_RE_TAG: ${{ github.event.inputs.nm3u8dl_tag || 'latest' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            os: linux
            archive_ext: tar.gz
            nm3u8_pattern: "_linux-x64_.*\\.tar\\.gz$"
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            archive_ext: tar.gz
            nm3u8_pattern: "_linux-arm64_.*\\.tar\\.gz$"
          - target: osx-arm64
            runner: macos-14
            os: macos
            archive_ext: tar.gz
            nm3u8_pattern: "_osx-arm64_.*\\.tar\\.gz$"
          - target: win-x64
            runner: windows-2022
            os: windows
            archive_ext: zip
            msystem: CLANG64
            tool_root: /clang64
            ffmpeg_pkg: mingw-w64-clang-x86_64-ffmpeg
            compiler_pkg: mingw-w64-clang-x86_64-clang
            pkgconfig_pkg: mingw-w64-clang-x86_64-pkg-config
            make_pkg: make
            jq_pkg: mingw-w64-clang-x86_64-jq
            nm3u8_pattern: "_win-x64_.*\\.zip$"
          - target: win-arm64
            runner: windows-11-arm
            os: windows
            archive_ext: zip
            msystem: CLANGARM64
            tool_root: /clangarm64
            ffmpeg_pkg: mingw-w64-clang-aarch64-ffmpeg
            compiler_pkg: mingw-w64-clang-aarch64-clang
            pkgconfig_pkg: mingw-w64-clang-aarch64-pkg-config
            make_pkg: make
            jq_pkg: mingw-w64-clang-aarch64-jq
            nm3u8_pattern: "_win-arm64_.*\\.zip$"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libavformat-dev libavcodec-dev libavutil-dev jq

      - name: Install macOS dependencies
        if: matrix.os == 'macos'
        run: brew install ffmpeg pkg-config jq

      - name: Setup MSYS2
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.make_pkg }}
            ${{ matrix.compiler_pkg }}
            ${{ matrix.pkgconfig_pkg }}
            ${{ matrix.ffmpeg_pkg }}
            ${{ matrix.jq_pkg }}
            unzip
            zip
            curl

      - name: Build udrm_remux (Linux/macOS)
        if: matrix.os != 'windows'
        run: make clean && make

      - name: Build udrm_remux (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: make clean && make

      - name: Resolve N_m3u8DL-RE asset URL (Unix)
        if: matrix.os != 'windows'
        id: resolve_asset
        run: |
          if [ "${N_M3U8DL_RE_TAG}" = "latest" ]; then
            url="https://api.github.com/repos/${N_M3U8DL_RE_REPO}/releases/latest"
          else
            url="https://api.github.com/repos/${N_M3U8DL_RE_REPO}/releases/tags/${N_M3U8DL_RE_TAG}"
          fi
          asset=$(curl -fsSL "$url" | jq -r --arg p "${{ matrix.nm3u8_pattern }}" '.assets[]|select(.name|test($p))|.browser_download_url'|head -n1)
          echo "asset_url=$asset" >> "$GITHUB_OUTPUT"

      - name: Resolve N_m3u8DL-RE asset URL (Windows)
        if: matrix.os == 'windows'
        id: resolve_asset_win
        shell: msys2 {0}
        run: |
          if [ "${N_M3U8DL_RE_TAG}" = "latest" ]; then
            url="https://api.github.com/repos/${N_M3U8DL_RE_REPO}/releases/latest"
          else
            url="https://api.github.com/repos/${N_M3U8DL_RE_REPO}/releases/tags/${N_M3U8DL_RE_TAG}"
          fi
          asset=$(curl -fsSL "$url" | jq -r --arg p "${{ matrix.nm3u8_pattern }}" '.assets[]|select(.name|test($p))|.browser_download_url'|head -n1)
          echo "asset_url=$asset" >> "$GITHUB_OUTPUT"

      # ===================== Linux 打包（扁平化目录）=====================
      - name: Package Linux (flat dir)
        if: matrix.os == 'linux'
        run: |
          mkdir -p pkg
          cp license.py udrm_remux pkg/
          ldd udrm_remux | awk '/=> \// && $1~/(libavformat|libavcodec|libavutil|libswresample|libswscale)/{print $3}' | sort -u | xargs -r cp -t pkg/
          curl -fsSL "${{ steps.resolve_asset.outputs.asset_url }}" | tar -xzf - --strip-components=1 -C pkg/
          tar -C pkg -czf "cctv-decrypt-${{ matrix.target }}.tar.gz" .

      # ===================== macOS 打包（扁平化 + 修复动态库路径）=====================
      - name: Package macOS (flat dir + fix rpath)
        if: matrix.os == 'macos'
        run: |
          mkdir -p pkg
          cp license.py udrm_remux pkg/
          otool -L udrm_remux | awk '/(libavformat|libavcodec|libavutil|libswresample|libswscale).*dylib/{print $1}' | sort -u | xargs -I{} cp -fv {} pkg/
          install_name_tool -add_rpath @executable_path pkg/udrm_remux
          for dylib in pkg/*.dylib; do
            install_name_tool -id @rpath/$(basename $dylib) $dylib
            install_name_tool -change $dylib @rpath/$(basename $dylib) pkg/udrm_remux
          done
          curl -fsSL "${{ steps.resolve_asset.outputs.asset_url }}" | tar -xzf - --strip-components=1 -C pkg/
          tar -C pkg -czf "cctv-decrypt-${{ matrix.target }}.tar.gz" .

      # ===================== Windows 打包（扁平化 + 完整复制 DLL）=====================
      - name: Package Windows (flat dir + full dlls)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          mkdir -p pkg
          cp license.py udrm_remux.exe pkg/
          cp -fv "${{ matrix.tool_root }}"/bin/*.dll pkg/
          curl -fsSL "${{ steps.resolve_asset_win.outputs.asset_url }}" -o nm.zip
          unzip -q -j nm.zip -d pkg/
          zip -rj "cctv-decrypt-${{ matrix.target }}.zip" pkg/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cctv-decrypt-${{ matrix.target }}
          path: cctv-decrypt-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Get tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          make_latest: true
