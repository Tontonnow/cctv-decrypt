name: Build and Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag used for release creation (e.g. v1.0.0)"
        required: true
        type: string
      nm3u8dl_tag:
        description: "N_m3u8DL-RE release tag"
        required: false
        default: "latest"
        type: string

permissions:
  contents: write

env:
  N_M3U8DL_RE_REPO: nilaoda/N_m3u8DL-RE
  N_M3U8DL_RE_TAG: ${{ github.event.inputs.nm3u8dl_tag || 'latest' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            os: linux
            archive_ext: tar.gz
            nm3u8_pattern: "_linux-x64_.*\\.tar\\.gz$"
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            archive_ext: tar.gz
            nm3u8_pattern: "_linux-arm64_.*\\.tar\\.gz$"
          - target: osx-x64
            runner: macos-13
            os: macos
            archive_ext: tar.gz
            nm3u8_pattern: "_osx-x64_.*\\.tar\\.gz$"
          - target: osx-arm64
            runner: macos-14
            os: macos
            archive_ext: tar.gz
            nm3u8_pattern: "_osx-arm64_.*\\.tar\\.gz$"
          - target: win-x64
            runner: windows-2022
            os: windows
            archive_ext: zip
            msystem: CLANG64
            tool_root: /clang64
            ffmpeg_pkg: mingw-w64-clang-x86_64-ffmpeg
            compiler_pkg: mingw-w64-clang-x86_64-clang
            pkgconfig_pkg: mingw-w64-clang-x86_64-pkg-config
            make_pkg: make
            jq_pkg: mingw-w64-clang-x86_64-jq
            nm3u8_pattern: "_win-x64_.*\\.zip$"
          - target: win-arm64
            runner: windows-11-arm
            os: windows
            archive_ext: zip
            msystem: CLANGARM64
            tool_root: /clangarm64
            ffmpeg_pkg: mingw-w64-clang-aarch64-ffmpeg
            compiler_pkg: mingw-w64-clang-aarch64-clang
            pkgconfig_pkg: mingw-w64-clang-aarch64-pkg-config
            make_pkg: make
            jq_pkg: mingw-w64-clang-aarch64-jq
            nm3u8_pattern: "_win-arm64_.*\\.zip$"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libavformat-dev libavcodec-dev libavutil-dev jq

      - name: Install macOS dependencies
        if: matrix.os == 'macos'
        run: brew install ffmpeg pkg-config jq

      - name: Setup MSYS2
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.make_pkg }}
            ${{ matrix.compiler_pkg }}
            ${{ matrix.pkgconfig_pkg }}
            ${{ matrix.ffmpeg_pkg }}
            ${{ matrix.jq_pkg }}
            unzip
            zip
            curl

      - name: Build udrm_remux (Linux/macOS)
        if: matrix.os != 'windows'
        run: make clean && make

      - name: Build udrm_remux (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: make clean && make

      - name: Resolve N_m3u8DL-RE asset URL (Linux/macOS)
        if: matrix.os != 'windows'
        id: resolve_asset_unix
        run: |
          if [ "${N_M3U8DL_RE_TAG}" = "latest" ]; then
            release_url="https://api.github.com/repos/${N_M3U8DL_RE_REPO}/releases/latest"
          else
            release_url="https://api.github.com/repos/${N_M3U8DL_RE_REPO}/releases/tags/${N_M3U8DL_RE_TAG}"
          fi
          release_json=$(curl -fsSL "$release_url")
          asset_url=$(echo "$release_json" | jq -r --arg pattern "${{ matrix.nm3u8_pattern }}" '.assets[] | select(.name | test($pattern)) | .browser_download_url' | head -n 1)
          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "No matching N_m3u8DL-RE asset found for pattern: ${{ matrix.nm3u8_pattern }}"
            exit 1
          fi
          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"

      - name: Resolve N_m3u8DL-RE asset URL (Windows)
        if: matrix.os == 'windows'
        id: resolve_asset_win
        shell: msys2 {0}
        run: |
          if [ "${N_M3U8DL_RE_TAG}" = "latest" ]; then
            release_url="https://api.github.com/repos/${N_M3U8DL_RE_REPO}/releases/latest"
          else
            release_url="https://api.github.com/repos/${N_M3U8DL_RE_REPO}/releases/tags/${N_M3U8DL_RE_TAG}"
          fi
          release_json=$(curl -fsSL "$release_url")
          asset_url=$(echo "$release_json" | jq -r --arg pattern "${{ matrix.nm3u8_pattern }}" '.assets[] | select(.name | test($pattern)) | .browser_download_url' | head -n 1)
          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "No matching N_m3u8DL-RE asset found for pattern: ${{ matrix.nm3u8_pattern }}"
            exit 1
          fi
          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"

      - name: Package bundle (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          bundle_dir="bundle-${{ matrix.target }}"
          mkdir -p "$bundle_dir/lib" "$bundle_dir/tools"
          cp license.py "$bundle_dir/"
          cp udrm_remux "$bundle_dir/"

          if [ "${{ matrix.os }}" = "linux" ]; then
            ldd udrm_remux | awk '/=> \// && ($1 ~ /(libavformat|libavcodec|libavutil|libswresample|libswscale|libpostproc)/) {print $3}' | sort -u | xargs -r -I{} cp -Lv "{}" "$bundle_dir/lib/"
          else
            otool -L udrm_remux | awk '/(libavformat|libavcodec|libavutil|libswresample|libswscale|libpostproc).*dylib/ {print $1}' | sort -u | xargs -I{} cp -Lv "{}" "$bundle_dir/lib/"
          fi

          curl -fsSL "${{ steps.resolve_asset_unix.outputs.asset_url }}" -o nm3u8dl.${{ matrix.archive_ext }}
          mkdir -p "$bundle_dir/tools/N_m3u8DL-RE"
          tar -xzf nm3u8dl.${{ matrix.archive_ext }} -C "$bundle_dir/tools/N_m3u8DL-RE"

          tar -czf "cctv-decrypt-${{ matrix.target }}.tar.gz" "$bundle_dir"

      - name: Package bundle (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          bundle_dir="bundle-${{ matrix.target }}"
          mkdir -p "$bundle_dir/lib" "$bundle_dir/tools"
          cp license.py "$bundle_dir/"
          cp udrm_remux.exe "$bundle_dir/"

          cp -Lv "${{ matrix.tool_root }}/bin"/libavcodec*.dll "$bundle_dir/lib/" || true
          cp -Lv "${{ matrix.tool_root }}/bin"/libavformat*.dll "$bundle_dir/lib/" || true
          cp -Lv "${{ matrix.tool_root }}/bin"/libavutil*.dll "$bundle_dir/lib/" || true
          cp -Lv "${{ matrix.tool_root }}/bin"/libswresample*.dll "$bundle_dir/lib/" || true
          cp -Lv "${{ matrix.tool_root }}/bin"/libswscale*.dll "$bundle_dir/lib/" || true

          curl -fsSL "${{ steps.resolve_asset_win.outputs.asset_url }}" -o nm3u8dl.zip
          mkdir -p "$bundle_dir/tools/N_m3u8DL-RE"
          unzip -q nm3u8dl.zip -d "$bundle_dir/tools/N_m3u8DL-RE"

          zip -r "cctv-decrypt-${{ matrix.target }}.zip" "$bundle_dir"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cctv-decrypt-${{ matrix.target }}
          path: cctv-decrypt-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
          make_latest: true